name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.2"
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check src/ scripts/ tests/
      - run: uv run ruff format --check src/ scripts/ tests/

  config-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.2"
      - run: uv sync --extra dev --frozen
      - name: Validate config + DVC consistency contracts
        run: uv run pytest -q tests/test_config_consistency.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.2"
      - run: uv sync --extra dev --frozen
      - run: uv run pytest -x -m "not slow" --tb=short

  streamlit-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.2"
      - run: uv sync --extra dev --frozen
      - name: Verify Streamlit page imports
        run: uv run pytest -q tests/test_streamlit/test_page_imports.py
