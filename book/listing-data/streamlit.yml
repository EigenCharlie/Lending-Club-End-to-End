- title: "PD & Uncertainty Lab"
  description: "Comparación interactiva del champion PD, calibración, cobertura, set prediction y trade-offs de incertidumbre."
  pages: "model_laboratory.py"
  when_to_use: "Cuando quieres contrastar variantes, sensibilidad y cobertura antes de bajar la lectura oficial al libro."
  relation: "Quarto fija el resultado defendible; Streamlit conserva la interacción fina."
- title: "Explainability Explorer"
  description: "Drivers globales, casos locales, bins WOE y reason codes en una superficie pensada para exploración real."
  pages: "model_interpretability.py"
  when_to_use: "Cuando necesitas navegar explicaciones, segmentos o casos individuales sin duplicar capítulos completos."
  relation: "El libro absorbe la narrativa estable; Streamlit deja explorar evidencia y ejemplos."
- title: "Portfolio & IFRS9 Simulator"
  description: "Simulación de capital, provisiones, escenarios y costo económico de robustez."
  pages: "portfolio_optimizer.py"
  when_to_use: "Cuando quieres mover parámetros y ver sensibilidad operativa en tiempo real."
  relation: "Quarto contiene la política oficial; Streamlit queda para simulación opcional."
- title: "Causal Policy Lab"
  description: "Exploración de CATE, reglas causales, tail risk y sensibilidad económica de intervenciones."
  pages: "causal_intelligence.py"
  when_to_use: "Cuando conviene navegar heterogeneidad causal por segmento o contrastar reglas candidatas."
  relation: "El libro documenta la lectura causal oficial; Streamlit conserva la exploración segmentada."
- title: "Data Explorer"
  description: "Slicing rápido del universo Lending Club, mezcla temporal y navegación ligera de dataset/linaje."
  pages: "data_story.py"
  when_to_use: "Cuando necesitas orientarte rápido en el dataset o validar composición sin recorrer todo el libro."
  relation: "Quarto fija la explicación larga; Streamlit ofrece navegación ágil."
