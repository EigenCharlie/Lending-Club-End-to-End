- title: "Comparación canónica de modelos"
  path: "data/processed/model_comparison.json"
  producer: "scripts/train_pd_model.py"
  consumer: "capítulos 6, 11, papers y Streamlit"
  role: "Métricas finales de discriminación, calibración y selección del champion."
- title: "Estado de policy conformal"
  path: "models/conformal_policy_status.json"
  producer: "scripts/validate_conformal_policy.py"
  consumer: "capítulos 7, 10, 16 y MRM"
  role: "Checks de cobertura, criterio de promoción y alertas temporales."
- title: "Resumen IFRS9 por escenario"
  path: "data/processed/ifrs9_scenario_summary.parquet"
  producer: "scripts/run_ifrs9_sensitivity.py"
  consumer: "capítulo 10 y Paper 2"
  role: "ECL agregado y desagregado por escenario y stage."
- title: "Frontera alpha–cobertura–retorno"
  path: "data/processed/alpha_sweep_pareto_both.parquet"
  producer: "scripts/run_alpha_sweep.py"
  consumer: "capítulos 9, 13 y Paper Estrella"
  role: "Trade-off explícito entre cobertura, ancho, elegibilidad y retorno."
- title: "Registro del champion"
  path: "models/champion_registry.json"
  producer: "scripts/update_champion_registry.py"
  consumer: "capítulos 10, 17 y companion"
  role: "Fuente de verdad para run activo, policy campeona y trazabilidad de promoción."
- title: "Conjunto maestro de préstamos"
  path: "data/processed/loan_master.parquet"
  producer: "src/data/build_datasets.py + src/features/*"
  consumer: "capítulos 5 al 13, Streamlit y notebooks"
  role: "Base analítica consolidada desde la que nacen features, benchmark y análisis secundarios."
