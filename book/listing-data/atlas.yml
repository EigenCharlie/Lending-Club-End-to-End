- title: "Gradiente de default por grade y plazo"
  description: "La primera lectura estructural del dataset: riesgo no uniforme por calidad crediticia y madurez."
  image: "../assets/figures/notebooks/default_rate_grade_x_term.png"
  image_alt: "Mapa de calor del default rate por grade y term en Lending Club."
  purpose: "Aterrizar que el riesgo del portafolio no es homogéneo y que plazo más grade ya cargan señal económica."
  insight: "A igual grade, los préstamos a 60 meses concentran más default que los de 36 meses."
  decision: "Justificar segmentación temprana, survival y lectura prudencial más rica que una PD promedio."
  connection: "Se reutiliza en los capítulos 8, 10 y 12."
- title: "Ranking IV de variables candidatas"
  description: "Una vista rápida de qué familias de variables merecen entrar a la historia del feature engineering."
  image: "../assets/figures/notebooks/iv_ranking.png"
  image_alt: "Ranking IV de variables en el notebook de feature engineering."
  purpose: "Separar señales con contenido predictivo de columnas accesorias o frágiles."
  insight: "Pocas familias concentran gran parte del valor inicial de segmentación."
  decision: "Priorizar variables interpretables y consistentes antes de perseguir complejidad de modelo."
  connection: "Conecta con los capítulos 5, 6 y 11."
- title: "Trade-off cobertura–ancho"
  description: "La incertidumbre útil no se gana solo con cobertura; también se negocia con anchura operativa."
  image: "../assets/figures/notebooks/coverage_width_tradeoff.png"
  image_alt: "Trade-off entre cobertura y ancho de intervalo para variantes conformales."
  purpose: "Mostrar por qué cumplir cobertura no basta si el costo es un intervalo inmanejable."
  insight: "No toda variante válida sirve para negocio cuando paga demasiado ancho."
  decision: "Promover Mondrian y variantes con lectura por grupo y estabilidad temporal."
  connection: "Sostiene los capítulos 7, 9, 10 y la capa Mondrian usada por Paper 4."
- title: "Resumen SHAP global del champion"
  description: "La puerta de entrada editorial a interpretabilidad global y familias de drivers."
  image: "../assets/figures/notebooks/shap_beeswarm.png"
  image_alt: "SHAP beeswarm del modelo champion de PD."
  purpose: "Convertir el score PD en una historia verificable para negocio y gobernanza."
  insight: "Precio, plazo, FICO y capacidad financiera siguen dominando el modelo."
  decision: "Usar reason codes estables y monitorear drift explicativo, no solo drift de score."
  connection: "Se despliega en el capítulo 11 y en la capa MRM del capítulo 10."
- title: "KPIs de política causal"
  description: "Causalidad tratada como capa de policy y priorización económica, no como adorno metodológico."
  image: "../assets/figures/notebooks/causal_policy_kpis.png"
  image_alt: "KPIs causales y de policy causal del proyecto."
  purpose: "Pasar de asociación a intervención defendible por segmento."
  insight: "El efecto promedio no basta; la heterogeneidad es la parte accionable."
  decision: "Usar CATE para ordenar decisiones de política, no para reemplazar el score PD."
  connection: "Alimenta causalidad en el capítulo 8 y portafolio en el capítulo 9."
- title: "Dashboard integrado del pipeline"
  description: "Una vista de sistema que conecta predicción, incertidumbre, provisión y decisión."
  image: "../assets/figures/notebooks/pipeline_dashboard.png"
  image_alt: "Dashboard integrado del pipeline end-to-end del proyecto."
  purpose: "Mostrar que el proyecto no son páginas aisladas, sino una cadena de artefactos."
  insight: "La historia editorial vive en las conexiones entre bloques, no en métricas sueltas."
  decision: "Reservar Streamlit para exploración y dejar en Quarto las vistas estables que sintetizan la historia."
  connection: "Se conecta con prefacio, capítulo 1, capítulo 4 y los papers."
