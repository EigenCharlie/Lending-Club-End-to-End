bibliography: references.bib
csl: apa.csl
reference-section-title: "Referencias"
lang: es
language:
  search-text-placeholder: "Buscar capítulos, conceptos y artefactos"

format:
  html:
    theme:
      light: [cosmo, brand, styles.scss]
      dark: [slate, brand, styles.scss]
    respect-user-color-scheme: true
    page-layout: article
    grid:
      sidebar-width: 340px
      body-width: 1080px
      margin-width: 320px
      gutter-width: 1.35rem
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    code-fold: false
    code-summary: "Mostrar código"
    code-tools: false
    code-copy: true
    code-line-numbers: false
    code-overflow: wrap
    code-block-bg: true
    code-block-border-left: "#1E5AA8"
    highlight-style: pygments
    fig-responsive: true
    fig-cap-location: top
    fig-align: center
    lightbox: false
    callout-appearance: simple
    citations-hover: true
    footnotes-hover: true
    crossrefs-hover: true
    include-after-body: includes/apa-figures.html
  pdf:
    documentclass: scrbook
    papersize: letter
    fontsize: 11pt
    geometry:
      - margin=1in
    toc: true
    toc-depth: 2
    lof: true
    lot: true
    number-sections: true
    code-fold: false
    keep-tex: true
    include-in-header:
      - latex/preamble.tex

execute:
  freeze: true
  echo: false
  warning: false
  error: false

crossref:
  chapters: true
  fig-prefix: "Figura"
  tbl-prefix: "Tabla"
  eq-prefix: "Ecuación"
  sec-prefix: "Sección"
