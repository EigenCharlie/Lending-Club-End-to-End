project:
  type: book
  output-dir: _output

quarto-required: "1.9.35"
jupyter: bookcpu
metadata-files:
  - _variables.yml

book:
  title: "Gestión de Riesgo Crediticio con Predicción Conformal y Optimización Robusta"
  subtitle: "Un Pipeline Completo de ML, Incertidumbre, Optimización e IFRS9 sobre Lending Club"
  author: "Carlos Alfredo Vergara Rojas"
  date: today
  date-format: "MMMM YYYY"
  search:
    location: sidebar
    type: textbox
    show-item-context: true
    collapse-after: 4
    copy-button: true
  reader-mode: false
  page-navigation: true
  downloads: [pdf]
  repo-url: "https://github.com/EigenCharlie/Lending-Club-End-to-End"
  repo-actions: [edit, issue]
  page-footer:
    left: "Quarto es la edición oficial del Lending Club Risk Project."
    right: "Edición digital del proyecto"
