schema_version: "2026-03-27.1"
description: >
  Expanded monotonic CatBoost competitor search against the frozen clean
  baseline. This search is intentionally broader than the compact 9-run setup:
  it explores multiple curated constraint profiles, richer regularization
  regimes, two calibrators, and stability across two seeds.

defaults:
  replay_manifest: configs/baselines/clean_baseline_manifest.json
  config_path: configs/pd_model.champion_search_max.yaml
  output_path: models/monotonic_competitor_search_expanded.json
  best_output_path: models/monotonic_competitor_best_expanded.json

promotion_policy:
  max_auc_drop: 0.003
  max_brier_increase_pct: 0.015
  max_ece_delta: 0.01
  require_fairness_ok: true

calibration_methods:
  - venn_abers
  - isotonic

seed_offsets:
  - 0
  - 17

constraint_profiles:
  strict_all:
    use_all_declared_constraints: true
  core_partial:
    features:
      annual_inc: -1
      loan_to_income: 1
      dti: 1
      int_rate: 1
      installment: 1
      grade_woe: 1
  cautious_partial:
    features:
      annual_inc: -1
      dti: 1
      int_rate: 1
      grade_woe: 1
  affordability_only:
    features:
      annual_inc: -1
      loan_to_income: 1
      dti: 1
      installment: 1
  bureau_capacity:
    features:
      annual_inc: -1
      loan_to_income: 1
      rev_utilization: 1
      num_delinq_2yrs: 1
      days_since_last_delinq: -1
      grade_woe: 1
  risk_core:
    features:
      dti: 1
      rev_utilization: 1
      num_delinq_2yrs: 1
      days_since_last_delinq: -1
      int_rate: 1
      grade_woe: 1

param_variants:
  - id: base
    learning_rate_multiplier: 1.0
    l2_leaf_reg_multiplier: 1.0
    depth_offset: 0
    iterations_multiplier: 1.0
    random_strength_multiplier: 1.0
  - id: reg_up
    learning_rate_multiplier: 0.9
    l2_leaf_reg_multiplier: 1.5
    depth_offset: -1
    iterations_multiplier: 1.0
    random_strength_multiplier: 1.25
  - id: smoother
    learning_rate_multiplier: 0.85
    l2_leaf_reg_multiplier: 1.75
    depth_offset: -1
    iterations_multiplier: 1.15
    random_strength_multiplier: 1.4
  - id: deeper_regularized
    learning_rate_multiplier: 0.82
    l2_leaf_reg_multiplier: 1.8
    depth_offset: 1
    iterations_multiplier: 1.15
    random_strength_multiplier: 1.2
  - id: shallow_strong
    learning_rate_multiplier: 0.8
    l2_leaf_reg_multiplier: 2.2
    depth_offset: -2
    iterations_multiplier: 1.05
    random_strength_multiplier: 1.6
