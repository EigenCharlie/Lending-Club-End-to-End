schema_version: "2026-03-08.1"
profile_name: mega64
description: >
  Corrida de alta fidelidad ajustada para WSL2 con 24 hilos y ~60GB RAM.
  Lleva survival y causal a full, mantiene LGD/EAD full y amplia de forma
  agresiva pero controlada las etapas de optimizacion para evitar tiempos
  explosivos en Pyomo/HiGHS.

python_envs:
  main: lending-club-venv
  causal: .venv-causal
  rapids_conda: rapids

execution:
  promotion_mode: gates
  continue_on_failure: true

sampling:
  pd_model: full
  optuna_hpo: full
  conformal: full
  survival_rsf: full_300_trees
  lgd_ead: full
  portfolio_max_candidates: 100000
  portfolio_tradeoff_max_candidates: 60000
  simulate_ab_test_max_candidates: 100000
  optimize_cate_portfolio_max_candidates: 100000
  causal: full
  time_series: full
  ifrs9: full
  fairness: full
  export_shap: internal
  notebooks: include
  rapids: if_gpu_available

hardware_assumptions:
  cpu_threads: 24
  wsl_memory_gb: 60
  swap_gb: 24
  gpu: "RTX 3080 10GB"

estimated_runtime:
  preflight: "5 min"
  main_pre: "2-3 hrs"
  heavy_main: "6-9 hrs"
  causal: "2-3 hrs"
  cate_portfolio: "30-60 min"
  post_core: "1 hr"
  rapids: "2.5 hrs"
  notebooks: "5 hrs"
  total_without_rapids: "~18-24 hrs"
