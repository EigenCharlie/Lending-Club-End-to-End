schema_version: "2026-03-07.1"
profile_name: mega
description: >
  Corrida de maxima fidelidad. Datos completos en todas las etapas excepto
  optimizacion de portafolio (Pyomo LP) con cap de 30,000 candidatos para
  prevenir OOM. El criterio es riesgo de OOM, no tiempo de ejecucion.

python_envs:
  main: lending-club-venv
  causal: .venv-causal
  rapids_conda: rapids

execution:
  promotion_mode: gates
  continue_on_failure: true

sampling:
  pd_model: full              # 1.35M rows
  optuna_hpo: full            # incremental trials on existing ~927
  conformal: full             # pure prediction
  survival_rsf: full_250_trees  # 250 trees, full data (OOM-safe for WSL2 16-32GB)
  lgd_ead: full               # ~50K defaults
  portfolio_max_candidates: 30000  # Pyomo LP OOM cap
  causal: 500000              # CausalForest DML capped (OOM-safe for WSL2)
  time_series: full           # 118 rows
  ifrs9: full
  fairness: full
  export_shap: internal       # script samples internally
  notebooks: include
  rapids: if_gpu_available

oom_justification:
  portfolio_optimize: "Pyomo LP con 276K decision variables excede memoria (O(n^2) constraint matrix)"
  portfolio_tradeoff: "Misma explosion LP, compuesta por grid search"
  simulate_ab_test: "Mismo solver Pyomo LP subyacente"
  optimize_cate_portfolio: "Mismo solver Pyomo LP con ajustes CATE"
  survival_rsf: "RSF con 300+ arboles en 1.35M rows estima ~20-25GB peak; capped a 250 arboles"
  causal_forest: "CausalForestDML con 1.35M + cv=3 estima ~10-15GB peak; capped a 500K samples"

estimated_runtime:
  preflight: "5 min"
  main_pre: "2 hrs (PD full + conformal + forecast)"
  heavy_main: "4 hrs (survival full + LGD + portfolio 30K + AB test)"
  causal: "1 hr (full 1.35M train)"
  cate_portfolio: "20 min"
  post_core: "1 hr"
  notebooks: "5 hrs"
  total_without_rapids: "~16 hrs"
