schema_version: "2026-03-26.1"
profile_name: rerun_v2_smoke
pipeline_family: champion_search
description: >
  Smoke de resiliencia V2. Recorre el orquestador end-to-end con tamaños chicos
  para validar runtime statuses, artefactos atómicos y semántica de --resume
  antes del rerun grande.

python_envs:
  main: lending-club-venv
  causal: .venv-causal

execution:
  writes_canonical_artifacts: false
  promotion_state: research_open
  include_rapids: false
  include_notebooks: false

defaults:
  sampling_profile: smoke
  upstream_registry: configs/baselines/canonical_operational_baseline.json
  bundle_output: models/champion_search_bundle.json
  rapids_profile: current

resource_policy:
  pd_hpo_backend: cpu
  lgd_ead_backend: cpu
  portfolio_backend: highs
  tradeoff_backend: highs
  selector_backend: highs
  ab_backend: highs
  cate_backend: highs
  ifrs9_mc_backend: cpu

search_space:
  pd:
    config_path: configs/pd_model.smart.yaml

  survival:
    full_data: false
    sample_size: 5000
    rsf_sample_size: 2000
    rsf_n_estimators: 10
    rsf_max_samples: 0.25
    rsf_n_jobs: 1

  portfolio:
    max_candidates: 100

  tradeoff:
    max_candidates: 100
    grid_profile: quick

  ab:
    max_portfolio_pd: 0.18
    max_candidates: 100
    n_boot: 100
    seed: 42
    no_regression_tolerance_pct: 0.05

  causal:
    sample_size: 2000
    cate_n_estimators: 48
    cate_cv: 2
    cate_mc_iters: 1
    cate_criterion: het
    cate_min_balancedness_tol: 0.45
    cate_honest: true

  cate_portfolio:
    max_candidates: 100
