schema_version: "2026-03-12.2"
profile_name: champion_search_max
pipeline_family: champion_search
description: >
  Corrida mega definitiva de champion search. Reabre búsqueda pesada sobre el
  régimen campeón PD, amplía conformal y causal, usa GPU/cuOpt en las etapas OR
  del carril principal y deja notebooks + RAPIDS activados para anexos finales.

python_envs:
  main: lending-club-venv
  causal: .venv-causal
  rapids_conda: rapids

execution:
  writes_canonical_artifacts: false
  promotion_state: research_open
  include_rapids: true
  include_notebooks: true

defaults:
  sampling_profile: mega64plus
  upstream_registry: configs/baselines/canonical_operational_baseline.json
  bundle_output: models/champion_search_bundle.json
  rapids_profile: full_data

resource_policy:
  pd_hpo_backend: cpu
  lgd_ead_backend: gpu_if_stable
  portfolio_backend: cuopt
  tradeoff_backend: cuopt
  selector_backend: cuopt
  ab_backend: cuopt
  cate_backend: cuopt
  ifrs9_mc_backend: gpu_research

search_space:
  pd:
    config_path: configs/pd_model.champion_search_max.yaml

  conformal:
    alpha_target_90: 0.10
    alpha_95: 0.05
    alpha_candidates_90: [0.10, 0.095, 0.09, 0.085, 0.08, 0.075, 0.07]
    partition_candidates: [score_decile_mondrian, grade, grade_x_scoreband_mondrian]
    scaled_scores_options: [true, false]
    min_group_sizes: [150, 250, 500, 1000, 2000, 4000]
    benchmark_min_group_size_default: 150
    min_group_coverage_target: 0.89
    group_coverage_floor_target_90: 0.92
    max_width_budget_90: 0.90
    coverage_guardband_90: 0.005
    min_group_guardband_90: 0.0
    tuning_holdout_ratio: 0.25
    tuning_random_state: 42
    temporal_segment_floor_enabled: true
    temporal_segment_freq: M
    temporal_segment_min_size: 150
    group_coverage_floor_enabled: true
    shrinkback_enabled: false
    group_multiplier_grid: [1.0, 1.01, 1.02, 1.03, 1.05, 1.08, 1.12, 1.16]
    temporal_multiplier_grid: [1.0, 1.01, 1.02, 1.03, 1.05, 1.08, 1.12, 1.16]
    global_rebalance_enabled: true
    global_rebalance_min_factor: 0.65
    global_rebalance_max_factor: 1.05
    global_rebalance_step: 0.005

  survival:
    full_data: true
    rsf_n_estimators: 350
    rsf_max_depth: 14
    rsf_max_samples: 0.75
    rsf_min_samples_leaf: 8
    rsf_n_jobs: 16

  portfolio:
    max_candidates: 180000

  tradeoff:
    max_candidates: 150000
    grid_profile: balanced

  ab:
    max_portfolio_pd: 0.18
    max_candidates: 180000
    n_boot: 10000
    seed: 42
    no_regression_tolerance_pct: 0.05

  causal:
    sample_size: 0
    cate_n_estimators: 400
    cate_cv: 4
    cate_mc_iters: 3
    cate_criterion: het
    cate_min_balancedness_tol: 0.45
    cate_honest: true

  cate_portfolio:
    max_candidates: 180000

  rapids:
    ifrs9_mc:
      n_scenarios: 8192
      chunk_size: 256

  notebooks:
    timeout: 5400
    output_dir: reports/notebook_exec
