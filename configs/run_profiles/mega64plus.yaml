schema_version: "2026-03-08.1"
profile_name: mega64plus
description: >
  Corrida de alta fidelidad mas agresiva para WSL2 con 24 hilos y ~60GB RAM.
  Mantiene survival y causal full, y sube las etapas de optimizacion a un
  rango alto pero aun por debajo de full para evitar tiempos extremos en
  Pyomo/HiGHS durante el run principal.

python_envs:
  main: lending-club-venv
  causal: .venv-causal
  rapids_conda: rapids

execution:
  promotion_mode: gates
  continue_on_failure: true

sampling:
  pd_model: full
  optuna_hpo: full
  conformal: full
  survival_rsf: full_300_trees
  lgd_ead: full
  portfolio_max_candidates: 150000
  portfolio_tradeoff_max_candidates: 80000
  simulate_ab_test_max_candidates: 150000
  optimize_cate_portfolio_max_candidates: 150000
  causal: full
  time_series: full
  ifrs9: full
  fairness: full
  export_shap: internal
  notebooks: include
  rapids: if_gpu_available

hardware_assumptions:
  cpu_threads: 24
  wsl_memory_gb: 60
  swap_gb: 24
  gpu: "RTX 3080 10GB"

estimated_runtime:
  preflight: "5 min"
  main_pre: "2-3 hrs"
  heavy_main: "8-12 hrs"
  causal: "2-3 hrs"
  cate_portfolio: "45-90 min"
  post_core: "1 hr"
  rapids: "2.5 hrs"
  notebooks: "5 hrs"
  total_without_rapids: "~20-28 hrs"
