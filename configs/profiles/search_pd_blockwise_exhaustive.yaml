schema_version: "2026-04-02.1"
profile_name: search_pd_blockwise_exhaustive
pipeline_family: search_pd
description: >
  Ola exhaustiva PD enfocada en challenger monotónico blockwise /
  constrained-threshold. Reusa el champion monotónico como punto de partida y
  evita reabrir un HPO genérico indiscriminado.
execution:
  writes_canonical_artifacts: false
  promotion_state: research_open
  include_rapids: false
  include_notebooks: false
  include_conformal_sensitivity: false
defaults:
  sampling_profile: mega64plus
  upstream_registry: configs/baselines/canonical_operational_baseline.json
search_space:
  pd:
    config_path: configs/pd_model.champion.yaml
    monotonic_competitor_config: configs/monotonic_competitor_blockwise_exhaustive.yaml
