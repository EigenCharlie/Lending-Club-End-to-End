stages:
  core.data.make_dataset:
    cmd: uv run python -c "from src.data.make_dataset import main; main()"
    deps:
    - data/raw/Loan_status_2007-2020Q3.csv
    - src/data/make_dataset.py
    outs:
    - data/interim/lending_club_cleaned.parquet
  core.data.prepare_dataset:
    cmd: uv run python -c "from src.data.prepare_dataset import main; main()"
    deps:
    - data/interim/lending_club_cleaned.parquet
    - src/data/prepare_dataset.py
    outs:
    - data/processed/calibration.parquet
    - data/processed/test.parquet
    - data/processed/train.parquet
  core.data.materialize_feature_artifacts:
    cmd: uv run python scripts/materialize_feature_artifacts.py
    deps:
    - data/processed/calibration.parquet
    - data/processed/test.parquet
    - data/processed/train.parquet
    - scripts/materialize_feature_artifacts.py
    - src/features/feature_engineering.py
    outs:
    - data/processed/calibration_fe.parquet
    - data/processed/test_fe.parquet
    - data/processed/train_fe.parquet
    - data/processed/feature_config.pkl
    - data/processed/woe_encoders.pkl
    - data/processed/feature_manifest_v2.json
    - data/processed/feature_manifest_v2.parquet
  core.data.build_datasets:
    cmd: uv run python -c "from src.data.build_datasets import main; main()"
    deps:
    - data/processed/calibration.parquet
    - data/processed/test.parquet
    - data/processed/train.parquet
    - data/processed/train_fe.parquet
    - src/data/build_datasets.py
    outs:
    - data/processed/ead_dataset.parquet
    - data/processed/loan_master.parquet
    - data/processed/time_series.parquet
    - data/processed/time_series_full.parquet
    - data/processed/time_series_panel.parquet
  diagnostic.governance.dependency_summary:
    cmd: uv run python scripts/generate_dependency_summary.py
    deps:
    - pyproject.toml
    - uv.lock
    - requirements/causal-causalpy.txt
    - requirements/causal-econml.txt
    - requirements/feast-platform.txt
    - scripts/generate_dependency_summary.py
    outs:
    - models/dependency_audit_runtime_status.json
  core.pd.train_model:
    cmd: uv run python scripts/train_pd_model.py --config configs/pd_model.yaml
    deps:
    - configs/pd_model.yaml
    - data/processed/calibration_fe.parquet
    - data/processed/feature_config.pkl
    - data/processed/test_fe.parquet
    - data/processed/train_fe.parquet
    - scripts/train_pd_model.py
    outs:
    - data/processed/test_predictions.parquet
    - models/pd_training_record.pkl
    - models/pd_canonical.cbm
    - models/pd_canonical_calibrator.pkl
  core.conformal.generate_intervals:
    cmd: uv run python scripts/generate_conformal_intervals.py
    deps:
    - data/processed/calibration.parquet
    - data/processed/test.parquet
    - models/pd_canonical.cbm
    - models/pd_canonical_calibrator.pkl
    - scripts/generate_conformal_intervals.py
    outs:
    - data/processed/conformal_intervals_mondrian.parquet
    - data/processed/conformal_group_metrics_mondrian.parquet
    - data/processed/conformal_mondrian_tuning_90.parquet
    - data/processed/conformal_mondrian_tuning_90_pareto.parquet
    - data/processed/conformal_group_coverage_floor_report.parquet
    - models/conformal_results_mondrian.pkl
  search.conformal.benchmark_variants:
    cmd: uv run python scripts/benchmark_conformal_variants.py
    deps:
    - data/processed/calibration.parquet
    - data/processed/test.parquet
    - models/conformal_results_mondrian.pkl
    - models/pd_canonical.cbm
    - models/pd_canonical_calibrator.pkl
    - scripts/benchmark_conformal_variants.py
    outs:
    - data/processed/conformal_variant_benchmark.parquet
    - data/processed/conformal_variant_benchmark_by_group.parquet
  core.ts.forecast_default_rates:
    cmd: uv run python scripts/forecast_default_rates.py --horizon 12
    deps:
    - configs/time_series.yaml
    - data/processed/time_series_full.parquet
    - data/processed/time_series_panel.parquet
    - scripts/forecast_default_rates.py
    - src/models/time_series.py
    outs:
    - data/processed/ts_backtest_predictions.parquet
    - data/processed/ts_backtest_metrics.parquet
    - data/processed/ts_forecasts.parquet
    - data/processed/ts_cv_stats.parquet
    - data/processed/ts_ifrs9_scenarios.parquet
    - data/processed/ts_diagnostics.json
    - data/processed/ts_panel_forecasts.parquet
    - models/time_series_status.json
  research.ts.run_vnext:
    cmd: uv run python scripts/run_time_series_vnext.py --config configs/time_series_vnext.yaml
    deps:
    - configs/time_series_vnext.yaml
    - data/processed/conformal_intervals_mondrian.parquet
    - data/processed/ifrs9_ecl_comparison.parquet
    - data/processed/time_series_full.parquet
    - data/processed/time_series_panel.parquet
    - data/processed/train.parquet
    - models/time_series_status.json
    - scripts/run_time_series_vnext.py
    - src/data/build_datasets.py
    - src/models/time_series.py
    - src/models/time_series_vnext.py
    outs:
    - data/processed/time_series_vnext.parquet
    - data/processed/time_series_panel_vnext.parquet
    - data/processed/ts_backtest_predictions_vnext.parquet
    - data/processed/ts_backtest_metrics_vnext.parquet
    - data/processed/ts_interval_eval_vnext.parquet
    - data/processed/ts_forecasts_vnext.parquet
    - data/processed/ts_ifrs9_scenarios_vnext.parquet
    - data/processed/ts_panel_forecasts_vnext.parquet
    - data/processed/ts_joint_path_eval_vnext.parquet
    - data/processed/ts_joint_path_samples_vnext.parquet
    - data/processed/ts_ecl_intervals_vnext.parquet
    - data/processed/time_series_policy_review_matrix.parquet
    - models/time_series_vnext_status.json
    - models/time_series_policy_review.json
  research.causal.estimate_effects:
    cmd: bash scripts/causal/run_in_causal_env.sh scripts/estimate_causal_effects.py --treatment int_rate
    deps:
    - data/processed/train.parquet
    - data/processed/test.parquet
    - scripts/causal/run_in_causal_env.sh
    - scripts/estimate_causal_effects.py
    - src/models/causal.py
    outs:
    - data/processed/cate_estimates.parquet
    - data/processed/cate_estimates_oot.parquet
    - data/processed/causal_overlap_diagnostics.parquet
    - models/causal_forest_dml.pkl
    - models/causal_effect_status.json
    - models/causal_summary.pkl
  research.causal.simulate_policy:
    cmd: bash scripts/causal/run_in_causal_env.sh scripts/simulate_causal_policy.py
    deps:
    - data/processed/cate_estimates.parquet
    - models/causal_effect_status.json
    - scripts/causal/run_in_causal_env.sh
    - scripts/simulate_causal_policy.py
    outs:
    - data/processed/causal_policy_simulation.parquet
    - data/processed/causal_policy_segment_summary.parquet
    - data/processed/causal_policy_grade_summary.parquet
    - models/causal_policy_summary.pkl
  research.causal.validate_policy:
    cmd: bash scripts/causal/run_in_causal_env.sh scripts/validate_causal_policy.py
    deps:
    - data/processed/causal_policy_simulation.parquet
    - models/causal_effect_status.json
    - scripts/causal/run_in_causal_env.sh
    - scripts/validate_causal_policy.py
    outs:
    - data/processed/causal_policy_rule_candidates.parquet
    - data/processed/causal_policy_rule_selected.parquet
    - models/causal_policy_rule.json
  research.causal.backtest_oot:
    cmd: bash scripts/causal/run_in_causal_env.sh scripts/backtest_causal_policy_oot.py
    deps:
    - data/processed/causal_policy_simulation.parquet
    - data/processed/train.parquet
    - models/causal_policy_rule.json
    - models/causal_effect_status.json
    - scripts/causal/run_in_causal_env.sh
    - scripts/backtest_causal_policy_oot.py
    outs:
    - data/processed/causal_policy_oot_backtest.parquet
    - data/processed/causal_policy_oot_backtest_by_grade.parquet
    - models/causal_policy_oot_status.json
  core.ifrs9.run_sensitivity:
    cmd: uv run python scripts/run_ifrs9_sensitivity.py
    deps:
    - data/processed/conformal_intervals_mondrian.parquet
    - data/processed/test.parquet
    - data/processed/ts_ifrs9_scenarios.parquet
    - data/processed/train.parquet
    - models/time_series_status.json
    - scripts/run_ifrs9_sensitivity.py
    outs:
    - data/processed/ifrs9_scenario_summary.parquet
    - data/processed/ifrs9_scenario_grade_summary.parquet
    - data/processed/ifrs9_sensitivity_grid.parquet
    - data/processed/ifrs9_input_quality.parquet
    - models/ifrs9_sensitivity_summary.pkl
  core.portfolio.optimize:
    cmd: uv run python scripts/optimize_portfolio.py --config
      configs/optimization.yaml --risk_tolerance 0.10 --max_candidates 30000
    deps:
    - configs/optimization.yaml
    - data/processed/conformal_intervals_mondrian.parquet
    - data/processed/test.parquet
    - scripts/optimize_portfolio.py
    outs:
    - data/processed/portfolio_allocations.parquet
    - models/portfolio_results.pkl
  search.portfolio.tradeoff:
    cmd: uv run python scripts/optimize_portfolio_tradeoff.py --config
      configs/optimization.yaml --max_candidates 30000 --grid-profile night
    deps:
    - configs/optimization.yaml
    - data/processed/conformal_intervals_mondrian.parquet
    - data/processed/test.parquet
    - scripts/optimize_portfolio_tradeoff.py
    outs:
    - data/processed/portfolio_robustness_frontier.parquet
    - data/processed/portfolio_robustness_summary.parquet
    - models/portfolio_robustness_results.pkl
  paper2.survival.run_analysis:
    cmd: uv run python scripts/run_survival_analysis.py
    deps:
    - data/processed/loan_master.parquet
    - scripts/run_survival_analysis.py
    outs:
    - data/processed/lifetime_pd_table.parquet
    - models/cox_ph_model.pkl
    - models/rsf_model.pkl
    - models/survival_summary.pkl
  diagnostic.conformal.backtest_coverage:
    cmd: uv run python scripts/backtest_conformal_coverage.py
    deps:
    - data/processed/conformal_intervals_mondrian.parquet
    - data/processed/test.parquet
    - scripts/backtest_conformal_coverage.py
    outs:
    - data/processed/conformal_backtest_monthly.parquet
    - data/processed/conformal_backtest_monthly_grade.parquet
    - data/processed/conformal_backtest_alerts.parquet
  diagnostic.conformal.validate_policy:
    cmd: uv run python scripts/validate_conformal_policy.py --config configs/conformal_policy.yaml
    deps:
    - configs/conformal_policy.yaml
    - data/processed/conformal_backtest_alerts.parquet
    - data/processed/conformal_backtest_monthly.parquet
    - data/processed/conformal_group_metrics_mondrian.parquet
    - models/conformal_results_mondrian.pkl
    - scripts/validate_conformal_policy.py
    outs:
    - data/processed/conformal_policy_checks.parquet
    - models/conformal_policy_status.json
  core.governance.build_pipeline_results:
    cmd: uv run python scripts/build_pipeline_results.py
    deps:
    - data/processed/conformal_intervals_mondrian.parquet
    - data/processed/ifrs9_scenario_summary.parquet
    - data/processed/portfolio_robustness_summary.parquet
    - data/processed/test_predictions.parquet
    - scripts/build_pipeline_results.py
    - scripts/end_to_end_pipeline.py
    outs:
    - models/pipeline_results.pkl
  core.governance.export_streamlit_artifacts:
    cmd: uv run python scripts/export_streamlit_artifacts.py
    deps:
    - configs/explainability_taxonomy.json
    - data/raw/Loan_status_2007-2020Q3.csv
    - data/processed/feature_config.pkl
    - data/processed/loan_master.parquet
    - data/processed/test_fe.parquet
    - data/processed/test_predictions.parquet
    - data/processed/conformal_intervals_mondrian.parquet
    - models/conformal_policy_status.json
    - models/pd_model_contract.json
    - models/cox_ph_model.pkl
    - models/pd_training_record.pkl
    - models/pipeline_results.pkl
    - models/survival_summary.pkl
    - scripts/export_streamlit_artifacts.py
    outs:
    - data/processed/ale_curves.parquet
    - data/processed/eda_summary.json
    - data/processed/explainability_global.parquet
    - data/processed/explainability_local_cases.parquet
    - data/processed/feature_importance_iv.json
    - data/processed/pdp_ice_top5.parquet
    - data/processed/permutation_importance.parquet
    - data/processed/model_comparison.json
    - data/processed/pipeline_summary.json
    - data/processed/roc_curve_data.parquet
    - data/processed/calibration_curve_data.parquet
    - data/processed/hazard_ratios.parquet
    - data/processed/km_curve_data.parquet
    - data/processed/shap_interactions_or_redundancy.parquet
    - data/processed/shap_local_cases.parquet
    - data/processed/shap_raw_top20.parquet
    - data/processed/shap_summary.parquet
    - data/processed/state_aggregates.parquet
    - data/processed/roi_by_grade.parquet
    - data/processed/roi_by_grade_term.parquet
    - data/processed/runtime_status.json
  core.governance.run_fairness_audit:
    cmd: uv run python scripts/run_fairness_audit.py --config configs/fairness_policy.yaml
    deps:
    - configs/fairness_policy.yaml
    - data/processed/test_fe.parquet
    - data/processed/test_predictions.parquet
    - scripts/run_fairness_audit.py
    - src/evaluation/fairness.py
    outs:
    - data/processed/fairness_audit.parquet
    - data/processed/fairness_threshold_frontier.parquet
    - models/fairness_audit_status.json
  core.governance.generate_status:
    cmd: uv run python scripts/generate_governance_status.py --config configs/mrm_policy.yaml
    deps:
    - configs/mrm_policy.yaml
    - data/processed/train.parquet
    - data/processed/test.parquet
    - data/processed/fairness_threshold_frontier.parquet
    - data/processed/shap_raw_top20.parquet
    - models/challenger_promotion_report.json
    - models/fairness_audit_status.json
    - scripts/generate_governance_status.py
    - src/evaluation/backtesting.py
    - src/evaluation/explainability.py
    outs:
    - data/processed/drift_monitoring.parquet
    - data/processed/explanation_drift.parquet
    - models/governance_status.json
  diagnostic.pd.build_challenger_artifacts:
    cmd: uv run python scripts/build_pd_challenger_artifacts.py --config configs/pd_model.yaml
    deps:
    - configs/pd_model.yaml
    - data/processed/train.parquet
    - data/processed/test_fe.parquet
    - data/processed/test_predictions.parquet
    - data/processed/feature_config.pkl
    - scripts/build_pd_challenger_artifacts.py
    - src/evaluation/explainability.py
    outs:
    - data/processed/challenger_feature_selection.parquet
    - models/challenger_promotion_report.json
    - models/pd_challenger_spec.json
    - models/pd_challenger_spec_v2.json
  research.causal.optimize_cate_portfolio:
    cmd: uv run python scripts/optimize_cate_portfolio.py --max_candidates 30000
    deps:
    - data/processed/cate_estimates.parquet
    - data/processed/cate_estimates_oot.parquet
    - data/processed/conformal_intervals_mondrian.parquet
    - data/processed/test_fe.parquet
    - models/causal_effect_status.json
    - scripts/optimize_cate_portfolio.py
    - src/optimization/causal_portfolio.py
    outs:
    - data/processed/cate_portfolio_comparison.parquet
    - models/cate_portfolio_status.json
  search.portfolio.simulate_ab_test:
    cmd: uv run python scripts/simulate_ab_test.py --max_candidates 30000
    deps:
    - data/processed/conformal_intervals_mondrian.parquet
    - data/processed/test_fe.parquet
    - scripts/simulate_ab_test.py
    - src/evaluation/ab_testing.py
    outs:
    - data/processed/ab_simulation_results.parquet
    - data/processed/ab_simulation_summary.parquet
    - models/ab_simulation_status.json
  core.governance.generate_mrm_report:
    cmd: uv run python scripts/generate_mrm_report.py --config configs/mrm_policy.yaml
    deps:
    - configs/mrm_policy.yaml
    - data/processed/pipeline_summary.json
    - models/conformal_policy_status.json
    - models/fairness_audit_status.json
    - models/governance_status.json
    - scripts/generate_mrm_report.py
    outs:
    - reports/mrm/mrm_validation_report.json
  core.governance.export_storytelling_snapshot:
    cmd: uv run python scripts/export_storytelling_snapshot.py
    deps:
    - data/processed/ifrs9_scenario_summary.parquet
    - data/processed/model_comparison.json
    - data/processed/pipeline_summary.json
    - data/processed/portfolio_robustness_summary.parquet
    - models/conformal_policy_status.json
    - scripts/export_storytelling_snapshot.py
    outs:
    - reports/storytelling_snapshot.json
  core.governance.export_dvc_metrics:
    cmd: uv run python scripts/export_dvc_metrics.py --run-tag paper1-e2e-all-champions-2026-04-07
    deps:
    - data/processed/conformal_backtest_monthly.parquet
    - data/processed/ifrs9_scenario_summary.parquet
    - data/processed/portfolio_robustness_frontier.parquet
    - data/processed/test_predictions.parquet
    - models/conformal_policy_status.json
    - models/final_project_promotion.json
    - models/pipeline_results.pkl
    - scripts/export_dvc_metrics.py
    outs:
    - reports/dvc/conformal_coverage_backtest.csv
    - reports/dvc/metrics_summary.json
    - reports/dvc/robustness_frontier.csv

metrics:
- reports/dvc/metrics_summary.json

plots:
- reports/dvc/conformal_coverage_backtest.csv:
    x: month
    y:
    - coverage_90_roll3
    - target_90
    - coverage_95_roll3
    - target_95
- reports/dvc/robustness_frontier.csv:
    x: price_of_robustness_pct
    y: expected_return_net_point
